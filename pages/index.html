<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Powsybl Architecture</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #f4f7fb;
        color: #182333;
      }

      body {
        align-items: center;
        background-image: linear-gradient(rgba(36, 99, 235, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(36, 99, 235, 0.08) 1px, transparent 1px);
        background-size: 32px 32px;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        max-width: 560px;
      }

      h1 {
        font-size: 2.5rem;
        letter-spacing: 0;
        margin: 0 0 12px;
      }

      p {
        font-size: 1.125rem;
        line-height: 1.5;
        margin: 0 0 28px;
      }

      a {
        background: #2563eb;
        border-radius: 6px;
        color: #ffffff;
        display: inline-block;
        font-weight: 700;
        padding: 12px 16px;
        text-decoration: none;
      }

      a:focus-visible,
      a:hover {
        background: #1d4ed8;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111827;
          color: #e5edf8;
        }

        body {
          background-image: linear-gradient(rgba(125, 211, 252, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(125, 211, 252, 0.1) 1px, transparent 1px);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Powsybl Architecture</h1>
      <p>Explore the repository structure, IIDM model, and analysis views.</p>
      <a href="./app/#/project/powsybl-core/view/index/">Open architecture diagrams</a>
    </main>
  </body>
</html>
